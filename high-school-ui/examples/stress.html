<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>长文本与窄容器检查 · 高职教 UI</title><link rel="stylesheet" href="../css/tokens.css?v=826472eeb0"><link rel="stylesheet" href="../css/components.css?v=0a97096cdf"><link rel="stylesheet" href="../css/refinements.css?v=e692b2ad05"><style>
.stress-page{max-width:1180px;padding:28px 24px 60px;margin:auto}.stress-page>h1{font:600 26px/1.5 var(--v-font-serif);margin:30px 0 10px}.stress-page>p{font-size:13px;line-height:1.9;color:var(--v-secondary)}.stress-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:22px 0}.stress-tools select{height:36px;max-width:100%;border:1px solid var(--v-border);background:var(--v-card);border-radius:10px;padding:0 10px}.stress-stage{width:100%;max-width:100%;min-width:0;border:1px solid var(--v-border);border-radius:14px;background:var(--v-card);padding:16px}.stress-stage>.v-component{max-width:100%}.stress-inspection{font:12px/1.8 var(--v-font-mono);white-space:pre-wrap;overflow-wrap:anywhere;background:var(--v-card);border:1px solid var(--v-border);border-radius:10px;padding:14px;margin-top:20px}.stress-state-note{font-size:12px;color:var(--v-muted-foreground)}@media(max-width:500px){.stress-page{padding:20px 12px 40px}.stress-stage{padding:10px}}
</style><link rel="stylesheet" href="../css/extended-controls.css?v=6d14a71468"><link rel="stylesheet" href="../css/common-data.css?v=3cbdf9a6af"><link rel="stylesheet" href="../css/family-controls.css?v=8c232beef4"><link rel="stylesheet" href="../css/education-controls.css?v=e99556124e"><link rel="stylesheet" href="../css/education-next.css?v=abb2b2ca5a"><link rel="stylesheet" href="../css/education-platform.css?v=c78e03fa04"></head><body><main class="stress-page"><a href="quality-review.html">← 返回品质预览</a><h1>长文本与窄容器</h1><p>按可用容器逐项检查。表格、代码和长列表允许内部滚动；不将隐藏工作区、辅助朗读文本或主动省略视作可见溢出。这里的检测只是线索，仍需视觉与操作确认。</p><div class="stress-tools"><label>组件 <select id="stress-component" aria-label="选择检查组件"></select></label><label>容器 <select id="stress-width" aria-label="选择容器宽度"><option value="full">自适应</option><option value="480">480px</option><option value="320">320px</option></select></label><label>示例 <select id="stress-mode" aria-label="示例数据模式"><option value="long">长文本 / 边界数据</option><option value="default">默认数据</option><option value="disabled">禁用（适用控件）</option></select></label><button class="v-btn" type="button" id="stress-check">检查当前布局</button></div><div id="stress-stage" class="stress-stage"></div><pre id="stress-result" class="stress-inspection" role="status">请选择组件查看。</pre><p class="stress-state-note">按钮、输入和列表仍可操作。测试数据不写入组件库或真实平台。</p></main><script src="../js/icons.js?v=7487bc6b96"></script><script src="../js/catalog.js?v=7c62a95301"></script><script src="../js/resource-composer.js?v=bb10eef3e3"></script><script src="../js/skill-picker.js?v=59deef1a53"></script><script src="../js/content-workspace.js?v=3be51c4c5a"></script><script src="../js/voc-ui.js?v=5bb4f31e86"></script><script src="../js/controls.js?v=779f88bed5"></script><script src="../js/data-table.js?v=84e8fd4ad4"></script><script src="../js/batch-import.js?v=c2c6df043a"></script><script src="../js/temporal.js?v=262f16c1f9"></script><script src="../js/extended-controls.js?v=fd3fe59382"></script><script src="../js/schema-form.js?v=cc5e61119d"></script><script src="../js/advanced-table.js?v=15a4bb62dc"></script><script src="../js/common-extras.js?v=367dbbe707"></script><script src="../js/family-controls.js?v=08750a9ca3"></script><script src="../js/education-controls.js?v=ae99aa21f8"></script><script src="../js/education-next.js?v=f0b576cc0d"></script><script src="../js/education-platform.js?v=c6eece5aa9"></script><script src="../js/education-bridge.js?v=fac2068b08"></script><script>
const stage=document.getElementById('stress-stage'),component=document.getElementById('stress-component'),width=document.getElementById('stress-width'),mode=document.getElementById('stress-mode'),result=document.getElementById('stress-result');
component.innerHTML=VocCatalog.map(c=>`<option value="${c.key}">${VocUI.escape(c.name)} · ${c.key}</option>`).join('');component.value='date';
const longName='跨院系人工智能与智能制造产教融合综合实训项目课程资源及教学活动组织说明',noSpace='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'.repeat(4);
function props(key){if(mode.value==='disabled')return {disabled:true,state:'disabled',values:['人工智能技术应用','软件技术'],value:key==='tree-select'?['ai','software']:undefined,multiple:key==='tree-select'};if(mode.value!=='long')return {};if(key==='button')return {label:longName+noSpace};if(key==='input'||key==='textarea')return {label:longName,value:noSpace};if(key==='select')return {label:'超长选项',options:Array.from({length:150},(_,i)=>({value:'item-'+i,label:i+' · '+longName+noSpace.slice(0,24)})),value:'item-0'};if(key==='multiselect')return {options:Array.from({length:30},(_,i)=>({value:'item-'+i,label:i+' · '+longName})),values:['item-0','item-1','item-2','item-3','item-4']};if(key==='table'||key==='toolbar')return {title:'资源目录',rows:Array.from({length:80},(_,i)=>({id:'R'+i,name:i+' · '+longName,code:noSpace,owner:'信息工程学院与智能制造学院联合教学团队'})),columns:[{key:'name',label:'资源名称',sortable:true},{key:'code',label:'资源标识',sortable:true},{key:'owner',label:'负责人'}]};if(key==='person-picker')return {items:Array.from({length:40},(_,i)=>({id:'p'+i,name:'教师'+i+' · '+longName,department:'信息工程学院 / 人工智能技术应用专业'})),value:['p0','p1','p2']};if(key==='resource')return {items:Array.from({length:4},(_,i)=>({id:'r'+i,name:longName+noSpace+'.txt',type:'TXT',description:longName,version:'v'+(i+1)}))};if(key==='tree-select'||key==='cascade')return {multiple:true,nodes:[{id:'d1',label:longName,children:Array.from({length:12},(_,i)=>({id:'m'+i,label:longName+i}))}],value:['m0','m1']};if(key==='collapse')return {items:[{id:'a',title:longName,content:noSpace+' '+longName}],openKeys:['a']};if(key==='notification')return {items:[{id:'n',title:longName,description:noSpace,read:false}]};if(key==='feedback-result'||key==='empty')return {title:longName,description:noSpace};return {}}
function render(){stage.style.width=width.value==='full'?'100%':width.value+'px';VocUI.mount(stage,component.value,props(component.value));result.textContent='已渲染 '+component.value+'；点击“检查当前布局”查看线索。'}
function inspect(){const problems=[...stage.querySelectorAll('*')].filter(e=>{const b=e.getBoundingClientRect(),s=getComputedStyle(e);return !e.closest('[hidden],[inert],[aria-hidden=true]')&&!e.classList.contains('v-sr')&&b.width>0&&e.clientWidth>0&&e.scrollWidth>e.clientWidth+3&&!['auto','scroll'].includes(s.overflowX)&&s.textOverflow!=='ellipsis'&&!['svg','path','input','textarea'].includes(e.tagName.toLowerCase())}).map(e=>({element:e.className||e.tagName,width:e.clientWidth,content:e.scrollWidth}));result.textContent=JSON.stringify({component:component.value,container:Math.round(stage.clientWidth),pageOverflow:Math.max(0,document.documentElement.scrollWidth-innerWidth),candidates:problems},null,2)}
[component,width,mode].forEach(x=>x.addEventListener('change',render));document.getElementById('stress-check').onclick=inspect;render();
</script></body></html>

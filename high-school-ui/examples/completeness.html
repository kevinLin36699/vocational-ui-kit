(() => {const U=VocUI,V=VocVariants,grid=document.querySelector('#coverage-grid'),nav=document.querySelector('#coverage-nav');document.querySelector('#variant-count').textContent=V.total;function show(){const g=V.groups.find(x=>x.id===location.hash.slice(1))||V.groups[0];U.destroy(grid);nav.innerHTML=V.groups.map(x=>`<a href="#${x.id}" ${x===g?'aria-current="page"':''}>${x.title}<span>${x.items.length}</span></a>`).join('');document.querySelector('#coverage-intro').innerHTML=`<h2>${g.title}</h2><p>${g.description}</p>`;grid.innerHTML=g.items.map((x,i)=>`<article class="coverage-card" data-coverage="${g.id}-${i}"><header><h3>${x.title}</h3><code>${x.key}</code></header><div class="coverage-demo">${U.render(x.key,x.props)}</div>${x.note?`<p class="coverage-note">${U.escape(x.note)}</p>`:''}<details class="coverage-code"><summary>查看配置</summary>${U.codeBlock(`VocUI.mount(host, '${x.key}', ${JSON.stringify(x.props,null,2)});`,'javascript')}</details></article>`).join('');U.hydrate(grid);window.VocBusinessExamples?.attach(grid)}window.addEventListener('hashchange',show);document.addEventListener('voc:change',e=>document.querySelector('#coverage-event').textContent=JSON.stringify(e.detail,null,2));document.addEventListener('voc:action',e=>document.querySelector('#coverage-event').textContent=JSON.stringify(e.detail,null,2));show()})();
</script></body></html>

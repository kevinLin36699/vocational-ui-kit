<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>生成内容容器 · 高职教UI</title><link rel="stylesheet" href="../css/tokens.css?v=ac543b6824"><link rel="stylesheet" href="../css/components.css?v=525fce0621"><style>body{margin:0;background:var(--v-background)}main{max-width:1240px;margin:auto;padding:28px 32px}h1{font-size:26px;margin:22px 0 10px}.intro{font-size:14px;color:var(--v-secondary);line-height:1.8}.controls{display:flex;align-items:center;gap:12px;margin:24px 0;flex-wrap:wrap}.controls label{display:flex;gap:8px;align-items:center;font-size:13px}.controls select{width:140px}#host{border:1px solid var(--v-border);border-radius:var(--v-radius-card);overflow:hidden;height:500px}#host>.v-component,#host [data-workspace-host],#host [data-standalone-workspace]{height:100%!important}.slot-demo{padding:20px;display:grid;gap:16px}.slot-demo h2{font-size:18px;margin:0}.slot-demo .v-textarea{height:170px}#notice{font-size:13px;line-height:1.7;color:var(--v-secondary)}</style></head><body><main><a href="../index.html#/component/workspace">← 返回组件库</a><h1>生成内容容器</h1><p class="intro">通用组件只提供外壳，默认预留空内容区。具体预览、编辑器、版本和业务操作由页面接入。</p><div class="controls"><button class="v-btn" id="mount">挂载插槽示例</button><button class="v-btn" id="reset">恢复空位</button><label>容器状态<select class="v-input" id="state"><option value="empty">空位</option><option value="loading">加载中</option><option value="ready">就绪</option><option value="error">错误</option></select></label><a href="../design/GENERATED_CONTENT.md">接入规范</a></div><div id="host"></div><p id="notice" role="status">此页只验证容器插槽，不提供业务编辑器。</p></main><script src="../js/icons.js?v=7487bc6b96"></script><script src="../js/resource-composer.js?v=bb10eef3e3"></script><script src="../js/skill-picker.js?v=59deef1a53"></script><script src="../js/content-workspace.js?v=3be51c4c5a"></script><script src="../js/voc-ui.js?v=da1e6395aa"></script><script>
const host=document.querySelector('#host'),notice=document.querySelector('#notice');let panel;
function reset(){VocUI.mount(host,'workspace');panel=host.querySelector('[data-content-workspace]');document.querySelector('#state').value='empty';notice.textContent='此页只验证容器插槽，不提供业务编辑器。'}
document.querySelector('#reset').addEventListener('click',reset);
document.querySelector('#mount').addEventListener('click',()=>{const node=document.createElement('section');node.className='slot-demo';const title=document.createElement('h2');title.textContent='业务内容挂载示例';const label=document.createElement('label');label.className='v-field';label.textContent='示例输入';const input=document.createElement('textarea');input.className='v-textarea';input.value='在这里输入内容，收起再展开后仍然保留。';label.append(input);node.append(title,label);VocContentWorkspace.setContent(panel,node);VocContentWorkspace.setActions(panel,[{id:'read-input',label:'读取当前输入'}]);document.querySelector('#state').value='ready';notice.textContent='已挂载普通DOM节点，组件库不管理其业务字段。'});
document.querySelector('#state').addEventListener('change',e=>VocContentWorkspace.setState(panel,e.target.value));
host.addEventListener('voc:workspace-action',e=>{if(e.detail.actionId==='retry'){VocContentWorkspace.setState(panel,panel.querySelector('.slot-demo')?'ready':'empty');document.querySelector('#state').value=panel.querySelector('.slot-demo')?'ready':'empty';notice.textContent='示例重试已结束。'}else if(e.detail.actionId==='read-input')notice.textContent='当前输入：'+panel.querySelector('textarea').value});reset();
</script></body></html>

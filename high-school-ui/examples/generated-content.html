<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>生成内容容器 · 高职教UI</title><link rel="stylesheet" href="../css/tokens.css?v=826472eeb0"><link rel="stylesheet" href="../css/components.css?v=0a97096cdf"><style>body{margin:0;background:var(--v-background)}main{max-width:1240px;margin:auto;padding:28px 32px}h1{font-size:26px;margin:22px 0 10px}.intro{font-size:14px;color:var(--v-secondary);line-height:1.8}.controls{display:flex;align-items:center;gap:12px;margin:24px 0;flex-wrap:wrap}.controls label{display:flex;gap:8px;align-items:center;font-size:13px}.controls select{width:140px}#host{border:1px solid var(--v-border);border-radius:var(--v-radius-card);overflow:hidden;height:500px}#host>.v-component,#host [data-workspace-host],#host [data-standalone-workspace]{height:100%!important}.slot-demo{padding:20px;display:grid;gap:16px}.slot-demo h2{font-size:18px;margin:0}.slot-demo .v-textarea{height:170px}#notice{font-size:13px;line-height:1.7;color:var(--v-secondary)}</style><link rel="stylesheet" href="../css/refinements.css?v=e692b2ad05"><link rel="stylesheet" href="../css/extended-controls.css?v=6d14a71468"><link rel="stylesheet" href="../css/common-data.css?v=3cbdf9a6af"><link rel="stylesheet" href="../css/family-controls.css?v=8c232beef4"><link rel="stylesheet" href="../css/education-controls.css?v=e99556124e"><link rel="stylesheet" href="../css/education-next.css?v=abb2b2ca5a"><link rel="stylesheet" href="../css/education-platform.css?v=c78e03fa04"></head><body><main><a href="../index.html#/component/workspace">← 返回组件库</a><h1>生成内容容器</h1><p class="intro">通用组件只提供外壳，默认预留空内容区。具体预览、编辑器、版本和业务操作由页面接入。</p><div class="controls"><button class="v-btn" id="mount">挂载插槽示例</button><button class="v-btn" id="reset">恢复空位</button><label>容器状态<select class="v-input" id="state"><option value="empty">空位</option><option value="loading">加载中</option><option value="ready">就绪</option><option value="error">错误</option></select></label><a href="../design/GENERATED_CONTENT.md">接入规范</a></div><div id="host"></div><p id="notice" role="status">此页只验证容器插槽，不提供业务编辑器。</p></main><script src="../js/icons.js?v=7487bc6b96"></script><script src="../js/resource-composer.js?v=bb10eef3e3"></script><script src="../js/skill-picker.js?v=59deef1a53"></script><script src="../js/content-workspace.js?v=3be51c4c5a"></script><script src="../js/voc-ui.js?v=5bb4f31e86"></script><script src="../js/controls.js?v=779f88bed5"></script><script src="../js/data-table.js?v=84e8fd4ad4"></script><script src="../js/batch-import.js?v=c2c6df043a"></script><script src="../js/temporal.js?v=262f16c1f9"></script><script src="../js/extended-controls.js?v=fd3fe59382"></script><script src="../js/schema-form.js?v=cc5e61119d"></script><script src="../js/advanced-table.js?v=15a4bb62dc"></script><script src="../js/common-extras.js?v=367dbbe707"></script><script src="../js/family-controls.js?v=08750a9ca3"></script><script src="../js/education-controls.js?v=ae99aa21f8"></script><script src="../js/education-next.js?v=f0b576cc0d"></script><script src="../js/education-platform.js?v=c6eece5aa9"></script><script src="../js/education-bridge.js?v=fac2068b08"></script><script>
const host=document.querySelector('#host'),notice=document.querySelector('#notice');let panel;
function reset(){VocUI.mount(host,'workspace');panel=host.querySelector('[data-content-workspace]');document.querySelector('#state').value='empty';notice.textContent='此页只验证容器插槽，不提供业务编辑器。'}
document.querySelector('#reset').addEventListener('click',reset);
document.querySelector('#mount').addEventListener('click',()=>{const node=document.createElement('section');node.className='slot-demo';const title=document.createElement('h2');title.textContent='业务内容挂载示例';const label=document.createElement('label');label.className='v-field';label.textContent='示例输入';const input=document.createElement('textarea');input.className='v-textarea';input.value='在这里输入内容，收起再展开后仍然保留。';label.append(input);node.append(title,label);VocContentWorkspace.setContent(panel,node);VocContentWorkspace.setActions(panel,[{id:'read-input',label:'读取当前输入'}]);document.querySelector('#state').value='ready';notice.textContent='已挂载普通DOM节点，组件库不管理其业务字段。'});
document.querySelector('#state').addEventListener('change',e=>VocContentWorkspace.setState(panel,e.target.value));
host.addEventListener('voc:workspace-action',e=>{if(e.detail.actionId==='retry'){VocContentWorkspace.setState(panel,panel.querySelector('.slot-demo')?'ready':'empty');document.querySelector('#state').value=panel.querySelector('.slot-demo')?'ready':'empty';notice.textContent='示例重试已结束。'}else if(e.detail.actionId==='read-input')notice.textContent='当前输入：'+panel.querySelector('textarea').value});reset();
</script></body></html>

<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>日期边界与控件状态 · 高职教 UI</title><link rel="stylesheet" href="../css/tokens.css?v=826472eeb0"><link rel="stylesheet" href="../css/components.css?v=0a97096cdf"><link rel="stylesheet" href="../css/refinements.css?v=e692b2ad05"><style>main{max-width:960px;margin:auto;padding:28px 24px 60px}h1{font:600 26px/1.5 var(--v-font-serif);margin:30px 0 12px}.state-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,350px),1fr));gap:20px}.state-card{background:var(--v-card);border:1px solid var(--v-border);border-radius:14px;padding:20px;min-width:0}.state-card h2{font-size:15px}.state-card p{font-size:12px;color:var(--v-secondary);line-height:1.8}.state-event{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;line-height:1.8;margin-top:20px}</style><link rel="stylesheet" href="../css/extended-controls.css?v=6d14a71468"><link rel="stylesheet" href="../css/common-data.css?v=3cbdf9a6af"><link rel="stylesheet" href="../css/family-controls.css?v=8c232beef4"><link rel="stylesheet" href="../css/education-controls.css?v=e99556124e"><link rel="stylesheet" href="../css/education-next.css?v=abb2b2ca5a"><link rel="stylesheet" href="../css/education-platform.css?v=c78e03fa04"></head><body><main><a href="quality-review.html">← 返回品质预览</a><h1>日期边界与控件状态</h1><div class="state-grid"><section class="state-card"><h2>闰年</h2><div id="leap"></div><p>2024年二月应有29日；输入2026-02-29应提示无效。</p></section><section class="state-card"><h2>跨年</h2><div id="year"></div><p>保留12月与次年1月的范围值，不因时区发生偏移。</p></section><section class="state-card"><h2>上下限与禁选</h2><div id="bounds"></div><p>允许2026-10-20至2026-11-10，10月25日不可选；跨过禁选日的范围也不提交。</p></section><section class="state-card"><h2>单日期</h2><div id="single"></div><p>使用同一日期实现，表单字段为业务指定名称。</p></section><section class="state-card"><h2>禁用</h2><div id="disabled"></div></section><section class="state-card"><h2>只读</h2><div id="readonly"></div></section></div><pre id="event" class="state-event" role="status">操作控件后在这里显示实际变更数据。</pre></main><script src="../js/icons.js?v=7487bc6b96"></script><script src="../js/resource-composer.js?v=bb10eef3e3"></script><script src="../js/skill-picker.js?v=59deef1a53"></script><script src="../js/content-workspace.js?v=3be51c4c5a"></script><script src="../js/voc-ui.js?v=5bb4f31e86"></script><script src="../js/controls.js?v=779f88bed5"></script><script src="../js/data-table.js?v=84e8fd4ad4"></script><script src="../js/batch-import.js?v=c2c6df043a"></script><script src="../js/temporal.js?v=262f16c1f9"></script><script src="../js/extended-controls.js?v=fd3fe59382"></script><script src="../js/schema-form.js?v=cc5e61119d"></script><script src="../js/advanced-table.js?v=15a4bb62dc"></script><script src="../js/common-extras.js?v=367dbbe707"></script><script src="../js/family-controls.js?v=08750a9ca3"></script><script src="../js/education-controls.js?v=ae99aa21f8"></script><script src="../js/education-next.js?v=f0b576cc0d"></script><script src="../js/education-platform.js?v=c6eece5aa9"></script><script src="../js/education-bridge.js?v=fac2068b08"></script><script>
const cases={leap:{label:'闰年日期范围',value:['2024-02-28','2024-03-01']},year:{label:'跨年日期范围',value:['2026-12-30','2027-01-02']},bounds:{label:'受限日期范围',min:'2026-10-20',max:'2026-11-10',disabledDates:['2026-10-25']},single:{mode:'single',label:'课程开始日期',name:'courseStart',value:'2026-10-27'},disabled:{label:'禁用日期范围',state:'disabled',value:['2026-10-27','2026-10-28']},readonly:{label:'只读日期范围',readonly:true,value:['2026-10-27','2026-10-28']}};for(const [id,p]of Object.entries(cases))VocUI.mount(document.getElementById(id),'date',p);document.querySelector('main').addEventListener('voc:change',e=>document.getElementById('event').textContent=JSON.stringify(e.detail,null,2));

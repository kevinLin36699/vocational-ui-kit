<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>多类型生成内容 · 高职教UI</title><link rel="stylesheet" href="../css/tokens.css?v=2fd941ba77"><link rel="stylesheet" href="../css/components.css?v=9782fc9cc8"><style>body{margin:0;background:var(--v-background)}main{max-width:1320px;margin:auto;padding:24px 32px}h1{font-size:26px;margin:20px 0 10px}.intro{color:var(--v-secondary);font-size:14px;line-height:1.8}.controls{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:20px 0}.controls label{display:flex;align-items:center;gap:8px;font-size:13px}.controls .v-input{width:190px}#content{height:720px;border:1px solid var(--v-border);border-radius:var(--v-radius-card);overflow:hidden}#content>.v-component,#content [data-workspace-host],#content [data-standalone-workspace]{height:100%!important}details{margin-top:18px;font-size:13px}pre{white-space:pre-wrap;word-break:break-all;background:var(--v-card);padding:16px;border:1px solid var(--v-border);max-height:240px;overflow:auto}</style></head><body><main><a href="../index.html#/component/workspace">← 返回生成内容组件</a><h1>让不同内容，有合适的工作区</h1><p class="intro">从高职教原代码提取的代表性成果：课件、图谱、题目、课程包、计划、简历与报告等，按类型预览和编辑。<br>虚构内容 · 本地状态 · 不调用模型或业务服务；业务分组用于展示，不能作为正式权限。</p><div class="controls"><label>任务示例<select id="scenario" class="v-input"><option value="all">全部类型目录</option><option value="teaching">教学内容组合</option><option value="student">学生成长组合</option><option value="office">教务管理组合</option><option value="empty">空内容状态</option><option value="failed">生成失败状态</option><option value="generating">生成中状态</option><option value="unsupported">未支持类型</option></select></label><label><input type="checkbox" id="readonly">只读模式</label><button type="button" class="v-btn" id="reset">恢复当前示例</button><a href="../design/GENERATED_CONTENT.md">类型与接入规范</a><a href="../data/generated-content-index.json">源码覆盖索引</a></div><div id="content"></div><details><summary>最近一次内容事件</summary><pre id="event">尚无操作</pre></details></main><script src="../js/icons.js?v=7487bc6b96"></script><script src="../js/resource-composer.js?v=0898dbedb2"></script><script src="../js/skill-picker.js?v=59deef1a53"></script><script src="../js/content-data.js?v=9d4ecfa889"></script><script src="../js/content-workspace.js?v=6b9992f9b7"></script><script src="../js/voc-ui.js?v=5049ca80cc"></script><script>
const host=document.querySelector('#content'),choices={teaching:['outline','slides','interactive','video','knowledge','homework','package'],student:['career','education','certificate','competition','resume','interview'],office:['training-program','recognition','admissions','ability','quality','agent']};
function mount(){const mode=document.querySelector('#scenario').value;let contents=VocContentWorkspace.samples(choices[mode]);if(mode==='empty')contents=[];if(['failed','generating'].includes(mode)){contents=VocContentWorkspace.samples(['slides']);contents[0].status=mode}if(mode==='unsupported')contents=[{id:'future',kind:'unsupported',title:'待适配的新成果',items:[]}];VocUI.mount(host,'workspace',{contents,readonly:document.querySelector('#readonly').checked});document.querySelector('#event').textContent='尚无操作'}
document.querySelector('#scenario').addEventListener('change',mount);document.querySelector('#readonly').addEventListener('change',mount);document.querySelector('#reset').addEventListener('click',mount);host.addEventListener('voc:content',e=>{document.querySelector('#event').textContent=JSON.stringify(e.detail,null,2)});mount();
</script></body></html>
